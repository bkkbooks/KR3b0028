body:
  text: 篇題木牘篇題木牘守法要言庫法王兵市法守令李法王法委法田法兵令上扁下扁凡十三守法守法戰國應敵固守戰國者外修城郭內修甲戟矢弩萬乘之國郭方七里城方九里城高九仁池百步國城郭郭方十五里城方五里城高七仁池廣八十步大縣數也中縣小縣以民戶大縣二萬家中縣小縣以民戶之數制之數也廣毋下二尺八寸長毋得下三尺四寸甲人一弩矢甲戟鐵銛諸有朿鐵銛長十六尺大半尺者人一十四尺半者人一戟長十二尺半者人一弩人一人一必守城之法適在城下及且傅攻不斬守城之法客四面蛾傅之主人先知之主人利客上遂廣五百步中遂三百步下遂丈夫千人者萬人老不事者五千人嬰兒五千人女子負嬰百人以下之吏及與及伍人下城從不操其旗章從人非其故數也千人之將以下止之毋令得行行者吏與當盡斬之千千丈之城必郭逆之主人之利也不衆少裾袧而應之此守城之數也不在此其中者不與在五步一人中守城之令主人毋得與客言毋得遇舉手指摩姦詐之所橐也去其署者身斬父母妻子罪有法父母妻子與其身同罪諸爭敵人在城下城中行者皆止丈夫行罪非時得行者唯守禁邪為次殺雞狗毋令有聲城中之卒有之令也城上五十步而一樓樓間為二百步而一出樓三百步而一進行樓進行樓所以遠視城下及城外也為高藉車可以投五十步之內者二百步而一小回藉車五十步而一五人之大杯三人之小杯毋得十七尺后可以守及便斫外葉高七尺內葉高四尺外葉埤堄二百步而一隔必當出樓之下善為之而守之以射適遠卒及後行者為爵穴葉足之下可以客者十步而一為專牖於葉之中可以密射外者草步而一為蜚橦及繳張可以破蔽魯百步之內者遂十五劍戟固人備其所弩二人共一非適人傅城及在城下卒不得服弩弩恆在將吏之所城上面為一高候望之樓及隅為一以視適往來出入及圍十步一人與四尺皆列中圉當遂者二人列外圉當外者四人圉戶之廣毋過二尺二寸高毋過五尺無牖法也日食毋過日一斗星令也十日以斫辨入圉上為犯禁也圉高五十五尺內圉也卅三尺中圉也草七尺外圉也佰之吏毋下七十枚長枚毋下卌所以造城上之用皆人一積大瓦及石於城上靈辟之重皆五斗以上毋下人五十小石及毀瓦崎疾莉毋下人百五步一器水必受百斗置兩木栘其中為周道廣草尺草步一聾竈百步一井離城毋過草步草步一屏離城毋過十五步下之屏者必銜枚二人俱斬莫必置兔者城外以視適進芮變能請而為長耳目城中以觀姦邪事變諸官府室屋壯垣及家人室屋器戒可以給城守者盡用之不聽令者斬恆木及橾面為四積小石面為二所毀鐵及毀金器面為一積皆於城下城守之備也積石及毀瓦𩆜辟疾莉於城下百步而一積城守之造也五百卌八缺題一於龜民不親為之於身國不定為之則治官困則治家聖人未嘗離治是胃僞詐失民得法國日君失民失法罪死不赦凡治之道公治家莫如穡治官莫如公以直矣治莫如威以戒矣芒治樂以悲善治國者四國不危身不治不能自葆家不治不能相最官不治不能相使國不治非其主之有也大國事明法制飭仁義中國以守戰為功小國以事養為安大國外示諸侯以道𢛳內示民明以仁愛中國家者安四國肥六畜者益其食肥民人者少其使肥國家者飭其𢛳匹夫有深草可亡也良馬有乘遠道可長也賢材有合大道可明也水渴者其魚涸富民父母也有長位毋長道者匹夫也有卒不治敵人至弗能也有不親者丘虛也有民不親大功有下不忠焉能得窗明有長毋長道者也廢私立公為國之紀也事之重法而巠利學而巠其師人而巠其上者不能相最官人而巠其治者必節愛民如赤子敬法如師親賢如父凡守謹中如備外敬內如慎適后守庫法庫法大縣百里中縣七十里小縣五十里大縣二萬家中縣萬五千家小縣萬家以縣小大為賦之數也車可用者大縣七十乘小縣五十乘諸庫器善否美惡及穀試大㯳小㯳弩數也造𥾏弩五必絲之造鐖弩三四造𥾏弩三造鐖弩二縣庫器一長鐵銛十六尺大半尺者居四之一短鐵銛十四尺半者居十事恆器也長斧連棰長椎枋七尺椎首大十四寸長尺半連棰長尺八寸其尺梃長七尺大十二寸長長木栘枋八尺長方十尺長四尺三田艾諸器非甲戟矢弩及兵韋䪘之事及它物唯非守禦之具也然而庫之所為也必所以邑恆器者必善封璽之以嗇夫之璽縣庫器以帶暑濕邑嗇夫與庫嗇夫相參遁行之有生腐毀弗知甚大事也器成必試乃試器固有法邑嗇夫與兵官之吏嗇夫庫上匝庫吏善時為之固有歲課吏嗇夫與為者有重任庫器處臧必高燥濕適牖戶必分節出入器必以時恐處之空屚室屋毀敗而吏嗇夫弗知大罪也庫器者出入器器出庫工必進一其余甲王兵王兵主所以卑尊貴賤國所以存亡安危者莫鑿於兵故誅暴亂伐不道必以兵姦邪閉塞奇施必以刑然則兵者古所以外誅亂內禁邪故兵者尊主安國之主地必損而國必危矣內不用一至參至當一戰故勝者攻城圍邑主人渴盡易子而食之非以圈也見勝而起不見勝而止故計必先定然后兵可以起計未定而兵起者兵自怠者也是故張軍有不能戰圍邑有不能拔得地有不能仁參者見一焉則可破取也故不明適國之制者不可伐也不知其蓄積不能約不明其士卒弗先不審其將不可軍夫以治擊亂以富擊貧以能擊不能以教士擊驅民此十戰十勝百戰百勝之道故號令行卒則士知勝矣所𢝫之國能蜀利之所亞之國能蜀害之令行百則天下畏之位唯而權多則天下懷之必罰有罪而賞功則天下從之取天下精材論百工利器收天下豪桀有天下俊雄春秋穀試以闌精材動如雷神起如蜚鳥往如風雨莫當其前莫害其後獨出獨入莫能禁止有風雨之疾則不難遠道有蜚鳥之起則巠犯山河有雷神之戰則能獨制而毋適不遠道故禽絶地之民巠犯山河故能制侍固國獨行而毋適故令行天下伐國破邑不侍權天下莫之能害故可以有地君國出號令明法制無將不蚤知野無吏無蓄積官府毋長器戒苦𠋟朝廷無正民幸生先見適蜀行有積委久而不蕢器戒備功伐少費賞罰民不幸生則賢臣權盡是故將者審地刑選材官量蓄積撰勇士察知天下御機數而圖險𤕲舟車之險濡輪之水山陵林陸丘虛𤕲澤蒲葦平𦳝尺魯津洳涂淖大畝深基經溝下澤𣿐水深淺邑之小大城入相錯者乃可以行軍圍邑舉措起居知先後毋失地便王兵者必三具主明相文將武主事者將出令起卒有日定所欲功伐國使羣臣大吏左右及父兄毋敢議於成主之任也相國者論功勞行賞罰不敢隱賢使百官共敬悉畏毋敢隨行以侍主令大將者缺題二王者無市䩗者不成肆中國利市小國恃市市者百化之威用之量也中國能利市者強小國能利市者安市利則化行化行則民民則諸侯財物至諸侯財物至則小國富小國富則中國如此則小國置市也欲利市吏必力事焉民必大吏能平均下吏能毋割利焉輕正賦毋有庶孽毋煩其力事非市吏吏者具乃為市之廣陜小大之度令必爯邑便利其出入之門百化財物利之市必居邑之中令諸侯外邑來者毋毋相稽留也國市之法外營方四百步內宮爯之為鑿四達之市二分也為肆邪分列疏數有固有數矣市化貴者受肆毋過毋過七尺下化賤者受肆毋過十尺此肆邪市列之數也諸它化非職於肆列間也市嗇夫使不能獨利市邑嗇夫邑嗇夫至於市其市者也市李法李法然而置李者所以守國邑之吏嗇夫有罪巠重皆在國謹以從事國為公人三日李主法罰為公人一嗇夫與地吏斬所弗能得者嗇夫以其官罰國城一歲地之邑嗇夫奪半歲之艾其余缺題三凡欲富國豤草仁邑必外示之以利內為禁邪除害諸周文刻婁補紱𦀤組針𦇫之事及為末作捶拱倚立談語皆勿得為也此國之大害治之大傷不可不禁臣聞今世捶拱牟戎粟而食者二人隨戎者一人與戎者三人然世審節之而以足嘗試使三人一歲俱出耒耨之端是有三歲余食也二歲俱出耒耨之端是有六歲余食也三歲俱出耒耨之端是有十歲餘食也上家畝四中家三畝下家二畝歲十月卒歲之食具無余食人七石九斗者親死不得含十月冬衣畢具無余布人卌尺余帛人十尺者親死不得為㠵中之木把以上室中不盈百枚者親死不得為郭無井者親死不得浴無堂者親死不得肄一縣半豤者足以養其民其半為山林溪浴蒲葦魚鱉所出薪蒸而歸之少者曰我且往長焉壯者曰我且往觀焉老者曰我且往死焉是故不刑一民不傷一丈夫而海之外內可得矣臣聞之大國行仁義明道𢛳中國守戰小國事養天地之禮也故少不可不事長賤不可不事貴貧不可不事富亂不可不事治小不可不事大弱不可不事強少而不事長胃之賤而不事貴胃之不遂貧而不事富胃之困道弱而不事強胃之撓央小而不事大胃之召害亂而不事治胃之無時不可不審也臣聞古之王者雞狗之聲相聞其人民至死不得相問見也上非禁其相問見之道也法立令行而民毋以相問見為也凡民為禮節相朝夕問見者外以備患禍內以備衣食也臣聞柏王之國其民勞能佚之飢能食之寒能衣之亂能治之飢弗能食寒弗能衣亂弗能治則外弗能殺中弗能禁內弗能使上操三者民外無內無戚欲也殺之則死生之則生欲使之則使在上能審此三者柏王之道也不能審此三者而言王者是虛而為大跂而為長臣以為之也也所以長少也所以和六親也所以富國也所以強兵也所以廣土也所以尊主也所以行令也國富則民衆民衆則兵強兵強則土廣土廣則主尊主尊則令行令行則敵人制敵人制則諸侯賓服諸侯賓服則立立則王者之翹治也不可不審也古之帝者胃人黔人王者胃之黔首柏者胃之民諸侯胃之明王者必明道𢛳飭仁義為法制明度量也九百六委積委積田法量土地肥膮而立邑建城以城爯三相爯出可以戰與城三相爯乃可以於百里而一縣千里而一國古之示民明以作務示民明毋解怠如此則外無諸侯之患內無之憂出可以禦㒀入可法之大術也食口七人上家之數也食口六人中家之數也食口五人下家之數也以上年十三歲以下皆食於上年六十以上與年十六以至十四皆為半作什八人作者王什七人作者䩗什五人作者存什四人作者亡一人而田大畝草四者王一人而田十九畝者䩗一人而田十四畝者存一人而田九畝者亡王者一歲作而三歲食之霸者一歲作而二歲食之存者一歲作食之亡者一歲作十二月食之民之作務固之民之作務之器皆有技巧者為之其余皆以所長短官職之邑嗇夫度量民之所田小明示民乃為分職之數齊其食酓之量均其作務之業歲收中田小畝畝草斗中歲也上田畝草七斗下田畝十三斗大上與大下相復以為𧗿五十家而為里十里而為州十鄉而為州州鄉以地次受田於野百人為區千人為或人不舉或中之田以地次相五人為伍十人為連貧富相賦餘食不入於上皆於民也卒歲田入少入五十斗者之卒歲少入百斗者罰為公人一歲卒歲少入二百斗者罰為公人二歲出之之歲者以為公人終身卒歲少入三百斗者黥刑以為公人叔𦮼民得用之稿民得用其什一芻人一斗皆於民上家畜一豕一狗雞一雄一雌諸以令畜者皆其本齎其息得用之中家以下不能粟九升上為之出日大半升以為卅日之休醪卒歲大息上豫之十人而一斗肉使相食之酒食自因其所上使公人可使畜長者養牛馬及狗豕雞先大息五日上使民之壯者吏將以邋以便戎事以助大息之費邋毋過二日必錯民歲稱人邑嗇夫吏邑吏二人與田嗇夫及主田之所參也而課民之居焉循行立稼之狀而謹美亞之所在以為地均之歲巧參以為歲均計二歲而均計定三歲而一更賦田十歲而民畢易田令皆受地美亞均之數也大國為本作中國有便作小國以便作為本作邑之名山林可以為田器及可以為國大器者縣不得之制也恆山林者縣得制之大材之用焉五而當一山有木無大材然而斤斧得入焉九而當一禿蒹纆得入焉十而當一禿尺津罔得入焉七而當一小溪浴古罔不得入焉百而當一美霃澤蒲葦石百而當一百而當一千六十四兵令兵令兵者凶器逆𢛳爭者事之暴定仁義也戰國所以立威侵適弱國之所不能發也兵者以武為棟以文為以武為表以文以文為內能審此三者則知所以勝敗矣武者所以淩適分死生也危武者所適也文者所以守也兵之用文武也如鄉之應聲而之隨身也兵以專一勝以離散敗以數必固以疏將有威則生失威則死有威則勝毋威則敗卒有將則斫毋將則北賞罰之胃也卒畏將於適者戰勝卒畏適於將者戰北未戰所以知勝敗固稱將適敵之與將猶權衡也兵以安靜治以暴疾亂出卒兵固有恆令行伍之疏數固有恆法先適之恆令非追北衲邑先後之恆令前失後斬兵之恆有鄉適者有內鄉者有立者有坐將與卒非有父子之親血之樹六親之私也然而見適走之如歸前唯有千仁之溪折𦟜賞後則見必死之刑將前不能明其其嚴則敗軍死將禽卒也制嚴刑罰賞全功發之得伸斧越飭章旗有功必犯令必死及至兩適之相𧺹行伸薄近有天下之善者不能御大鼓之後矣出卒伸兵行伸視適章旗相望矢弩未合兵刃未椄先謞者虛後謞胃之實不謞胃之閉閉實也諸縣去軍百里者皆為守禦之備如居邊之一城也有令起軍將吏受鼓旗後其將吏出於縣部界述亡不從其將吏比於亡軍父母後將吏至大將之所一日吏戍一歲戰而失其將吏及將吏戰而死卒獨北而環其法當盡斬之將吏將其卒北斬其將三歲軍大戰大將死五百以上不能死適者皆當斬及大將左右近卒在者皆當斬奪一功其毋三歲軍功者戍三歲得其死罪赦卒逃歸及軍之傷也國之大費也而將不能禁止此內自弱之道也名在軍而實居於家不得其實吏以其糧為饒而身實食於家有食一人軍之名有二實之出國內空虛盡渴而外為歲曷內北之數也能止逃歸禁亡軍兵之一勝也使什伍相連也明其令嚴信功發之賞內能殺其少半者力加諸侯能殺其什一者卒臣聞百萬之衆而不戰不如萬人之尸萬人而不死不如百人之鬼信比四時令嚴如斧越利如干漿而士卒有不死用者未嘗之
